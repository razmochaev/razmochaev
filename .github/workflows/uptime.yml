name: Update Daily Uptime

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update README uptime
        run: python3 scripts/update_uptime.py
      - name: Amend and push if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "razmochaev"
            git config user.email "276775694+razmochaev@users.noreply.github.com"
            git add README.md
            git commit --amend --no-edit --reset-author
            git push --force-with-lease origin main
          fi
